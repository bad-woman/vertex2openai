<!DOCTYPE html>
<html lang="zh-CN" data-theme="sky-day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>登录 · agentplatform2api</title>
  <link rel="icon" type="image/webp" href="/static/avatar.webp" />
  <script>
    (function () {
      var valid = { "sky-day": 1, "paper-day": 1, "pop-day": 1, "star-night": 1, "lacquer-night": 1, "vinyl-night": 1 };
      var migrate = { "sakura-day": "paper-day", "sky-night": "star-night", "sakura-night": "lacquer-night", "hud-night": "lacquer-night" };
      var saved = "";
      try { saved = localStorage.getItem("ap2a_theme") || ""; } catch (e) {}
      if (migrate[saved]) saved = migrate[saved];
      if (!valid[saved]) {
        try {
          var legacy = localStorage.getItem("ap_theme");
          if (legacy === "dark") saved = "vinyl-night";
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) saved = "star-night";
          else saved = "sky-day";
        } catch (e) { saved = "sky-day"; }
      }
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body data-avatar-mood="idle">
  <div class="theme-fx-bg" id="themeFxBg" aria-hidden="true"></div>
  <div class="theme-fx" id="themeFx" aria-hidden="true"></div>
  <main class="login-page">
    <div class="glass-card login-card">
      <span class="avatar-ring login-ring">
        <img class="login-avatar" src="/static/avatar.webp" alt="429 娘" />
        <span class="avatar-tag" aria-hidden="true">429</span>
      </span>
      <h1 style="margin:0;font-size:20px;font-weight:760;letter-spacing:-0.02em;">
        agentplatform2api <span class="sparkle">✦</span>
      </h1>
      <p style="margin:5px 0 0;font-size:12.5px;color:var(--text-secondary);">
        Vertex AI 双通道透明代理控制台
      </p>

      <div class="login-themes" id="loginThemeGrid" aria-label="主题切换"></div>

      <form id="loginForm" onsubmit="return handleLogin(event)" autocomplete="off">
        <div class="field-group" style="text-align:left;margin-bottom:14px;">
          <label class="field-label" for="loginPwd">控制台访问密码（API_KEY）</label>
          <div class="key-input-wrap">
            <input id="loginPwd" type="password" autocomplete="current-password" class="field-input" placeholder="输入部署时配置的 API_KEY" required autofocus />
            <button type="button" class="key-eye" id="pwdEyeBtn" onclick="togglePwd()" aria-label="显示或隐藏密码">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;padding:11px;">
          进入控制台
        </button>

        <div class="login-error" id="loginErr"></div>
      </form>

      <div style="margin-top:14px;font-size:11.5px;color:var(--text-muted);">
        登录页与控制台共享 6 套艺术皮肤记忆 · 100% 离线零外链
      </div>
    </div>
  </main>

  <script>
    var THEMES = [
      { id: "sky-day", name: "晴空汽水", swatch: "swatch-sky-day", mode: "day" },
      { id: "paper-day", name: "宣纸茶寮", swatch: "swatch-paper-day", mode: "day" },
      { id: "pop-day", name: "潮玩波普", swatch: "swatch-pop-day", mode: "day" },
      { id: "star-night", name: "极夜星图", swatch: "swatch-star-night", mode: "night" },
      { id: "lacquer-night", name: "黑漆绯金", swatch: "swatch-lacquer-night", mode: "night" },
      { id: "vinyl-night", name: "午夜黑胶", swatch: "swatch-vinyl-night", mode: "night" }
    ];
    var curTheme = document.documentElement.getAttribute("data-theme") || "sky-day";

    function renderThemeFx(id) {
      var bg = document.getElementById("themeFxBg");
      var fg = document.getElementById("themeFx");
      if (!bg || !fg) return;
      if (id === "sky-day") {
        bg.innerHTML =
          '<div class="fx-sunbeam"></div>' +
          '<svg class="fx-bg-svg fx-clouds" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMax slice" fill="none">' +
            '<defs>' +
              '<linearGradient id="skyCloudHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/><stop offset="68%" stop-color="#e0f4ff" stop-opacity="0.58"/><stop offset="100%" stop-color="#bae6fd" stop-opacity="0.18"/></linearGradient>' +
              '<linearGradient id="skyCloudMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/><stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.34"/></linearGradient>' +
              '<radialGradient id="ramuneOrb" cx="34%" cy="30%" r="68%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/><stop offset="48%" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="100%" stop-color="#0db896" stop-opacity="0.24"/></radialGradient>' +
            '</defs>' +
            '<path d="M0 280V176C48 150 96 154 134 176C174 118 258 110 318 158C354 108 432 94 494 146C548 116 616 120 662 162C718 106 814 96 882 148C930 104 1022 98 1088 148C1132 126 1174 132 1200 148V280H0Z" fill="url(#skyCloudHi)"/>' +
            '<path d="M0 280V212C82 184 164 188 232 216C312 162 426 160 510 206C596 168 708 170 792 210C886 160 1002 162 1094 202C1138 184 1176 188 1200 200V280H0Z" fill="url(#skyCloudMid)"/>' +
            '<circle cx="984" cy="84" r="46" fill="url(#ramuneOrb)" stroke="rgba(0,119,204,0.22)" stroke-width="1.5"/>' +
            '<circle cx="984" cy="84" r="66" stroke="rgba(13,184,150,0.18)" stroke-width="1.2" stroke-dasharray="4 7"/>' +
            '<path d="M962 66 A28 28 0 0 1 996 56" stroke="rgba(255,255,255,0.88)" stroke-width="3" stroke-linecap="round"/>' +
          '</svg>';
        fg.innerHTML =
          '<span class="fx-bubble" style="--bx:12%;--bs:24px;--bd:11s;--bdelay:-2s;--bdrift:16px"></span>' +
          '<span class="fx-bubble" style="--bx:34%;--bs:14px;--bd:9s;--bdelay:-6s;--bdrift:-12px"></span>' +
          '<span class="fx-bubble" style="--bx:68%;--bs:20px;--bd:12s;--bdelay:-4s;--bdrift:18px"></span>' +
          '<span class="fx-bubble" style="--bx:88%;--bs:26px;--bd:10s;--bdelay:-8s;--bdrift:-16px"></span>';
      } else if (id === "paper-day") {
        bg.innerHTML =
          '<div class="fx-seal"><span>茶</span><span>寮</span></div>' +
          '<svg class="fx-bg-svg fx-bamboo" viewBox="0 0 340 340" fill="none">' +
            '<path d="M26 -8 C40 72, 48 158, 34 308" stroke="rgba(39,115,92,0.20)" stroke-width="3.6" stroke-linecap="round"/>' +
            '<line x1="29" y1="68" x2="43" y2="66" stroke="rgba(39,115,92,0.32)" stroke-width="2.4" stroke-linecap="round"/>' +
            '<line x1="36" y1="142" x2="50" y2="140" stroke="rgba(39,115,92,0.30)" stroke-width="2.4" stroke-linecap="round"/>' +
            '<path d="M37 68 C84 52, 134 48, 184 62" stroke="rgba(39,115,92,0.16)" stroke-width="1.6" stroke-linecap="round"/>' +
            '<path d="M98 56 Q132 24 166 42 Q132 58 98 56Z" fill="rgba(39,115,92,0.20)"/>' +
            '<path d="M126 57 Q166 38 202 60 Q164 68 126 57Z" fill="rgba(39,115,92,0.16)"/>' +
            '<path d="M114 126 Q154 94 192 112 Q152 130 114 126Z" fill="rgba(39,115,92,0.18)"/>' +
            '<path d="M150 128 Q194 112 228 138 Q188 144 150 128Z" fill="rgba(184,124,34,0.17)"/>' +
          '</svg>' +
          '<svg class="fx-bg-svg fx-mountains" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMax slice" fill="none">' +
            '<defs>' +
              '<linearGradient id="inkFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6e6050" stop-opacity="0.16"/><stop offset="100%" stop-color="#f5efe4" stop-opacity="0"/></linearGradient>' +
              '<linearGradient id="inkMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#27735c" stop-opacity="0.16"/><stop offset="100%" stop-color="#f5efe4" stop-opacity="0"/></linearGradient>' +
            '</defs>' +
            '<path d="M0 280V172 C120 112 220 74 340 138 C460 202 580 96 730 132 C870 166 970 86 1090 126 C1140 142 1176 146 1200 156 V280Z" fill="url(#inkFar)"/>' +
            '<path d="M0 280V202 C160 138 290 132 430 188 C580 248 730 144 890 176 C1020 202 1120 166 1200 188 V280Z" fill="url(#inkMid)"/>' +
          '</svg>';
        fg.innerHTML =
          '<span class="fx-leaf" style="--lx:24%;--ls:16px;--ld:14s;--ldelay:-3s"></span>' +
          '<span class="fx-leaf" style="--lx:78%;--ls:14px;--ld:16s;--ldelay:-9s"></span>';
      } else if (id === "pop-day") {
        bg.innerHTML =
          '<svg class="fx-bg-svg fx-pop-art" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" fill="none">' +
            '<polygon points="1116,12 1134,56 1180,44 1152,82 1192,108 1144,114 1152,162 1114,132 1084,168 1084,120 1038,122 1072,88 1042,50 1090,62" fill="rgba(255,212,59,0.34)" stroke="rgba(28,25,43,0.22)" stroke-width="2.5" stroke-linejoin="round"/>' +
            '<path d="M-20 698 L48 656 L112 698 L176 656 L240 698 L304 656 L368 698" stroke="rgba(45,92,242,0.26)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<path d="M840 742 L895 706 L950 742 L1005 706 L1060 742 L1115 706 L1170 742" stroke="rgba(255,71,108,0.26)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<rect x="40" y="124" width="54" height="54" rx="12" transform="rotate(-14 40 124)" fill="rgba(18,184,116,0.20)" stroke="rgba(28,25,43,0.22)" stroke-width="2.5"/>' +
          '</svg>' +
          '<span class="fx-pop-badge fx-pop-b1">✦ POP</span><span class="fx-pop-badge fx-pop-b2">★ 429</span>';
        fg.innerHTML = "";
      } else if (id === "vinyl-night") {
        bg.innerHTML =
          '<div class="fx-vinyl-disc"></div>' +
          '<svg class="fx-bg-svg fx-vinyl-arm" viewBox="0 0 160 160" fill="none">' +
            '<circle cx="128" cy="24" r="16" fill="#1a1714" stroke="rgba(229,169,60,0.48)" stroke-width="1.6"/>' +
            '<circle cx="128" cy="24" r="7" fill="rgba(229,169,60,0.34)" stroke="rgba(245,202,118,0.65)" stroke-width="1.2"/>' +
            '<path d="M124 34 C112 66, 98 84, 72 108 L56 122" stroke="rgba(245,202,118,0.62)" stroke-width="3.2" stroke-linecap="round"/>' +
            '<rect x="40" y="118" width="22" height="10" rx="2.5" transform="rotate(-38 40 118)" fill="#29231c" stroke="rgba(229,169,60,0.68)" stroke-width="1.4"/>' +
            '<circle cx="44" cy="130" r="2.6" fill="#de6b53"/>' +
          '</svg>' +
          '<svg class="fx-bg-svg fx-vinyl-wave" viewBox="0 0 1200 210" preserveAspectRatio="xMidYMax slice" fill="none">' +
            '<path d="M0 132 Q120 68 240 126 T480 116 T720 130 T960 92 T1200 124" stroke="rgba(229,169,60,0.26)" stroke-width="1.8"/>' +
            '<path d="M0 152 Q150 96 300 144 T600 132 T900 150 T1200 136" stroke="rgba(88,184,159,0.20)" stroke-width="1.4"/>' +
          '</svg>';
        fg.innerHTML = "";
      } else if (id === "lacquer-night") {
        bg.innerHTML =
          '<div class="fx-lacquer-seal"><span>漆</span><span>绘</span></div>' +
          '<svg class="fx-bg-svg fx-lacquer-branch" viewBox="0 0 340 320" fill="none">' +
            '<path d="M-8 14 C68 58, 128 84, 212 88" stroke="rgba(204,168,110,0.22)" stroke-width="2.4" stroke-linecap="round"/>' +
            '<path d="M88 64 C128 34, 168 24, 218 32" stroke="rgba(204,168,110,0.16)" stroke-width="1.4" stroke-linecap="round"/>' +
            '<circle cx="148" cy="40" r="6" fill="rgba(217,104,122,0.26)"/>' +
            '<circle cx="196" cy="84" r="7" fill="rgba(217,104,122,0.24)"/>' +
            '<circle cx="216" cy="34" r="4.5" fill="rgba(204,168,110,0.28)"/>' +
          '</svg>' +
          '<svg class="fx-bg-svg fx-seigaiha" viewBox="0 0 600 280" preserveAspectRatio="xMaxYMax slice" fill="none">' +
            '<g stroke="rgba(204,168,110,0.20)" stroke-width="1.1">' +
              '<path d="M220 280 A88 88 0 0 1 396 280"/><path d="M248 280 A60 60 0 0 1 368 280"/><path d="M276 280 A32 32 0 0 1 340 280"/>' +
              '<path d="M364 280 A88 88 0 0 1 540 280"/><path d="M392 280 A60 60 0 0 1 512 280"/><path d="M420 280 A32 32 0 0 1 484 280"/>' +
              '<path d="M292 218 A88 88 0 0 1 468 218"/><path d="M320 218 A60 60 0 0 1 440 218"/>' +
            '</g>' +
            '<g stroke="rgba(217,104,122,0.16)" stroke-width="1">' +
              '<path d="M76 280 A88 88 0 0 1 252 280"/><path d="M104 280 A60 60 0 0 1 224 280"/>' +
            '</g>' +
          '</svg>';
        fg.innerHTML =
          '<span class="fx-gold-fleck" style="--gx:18%;--gs:6px;--gd:15s;--gdelay:-2s"></span>' +
          '<span class="fx-gold-fleck" style="--gx:64%;--gs:5px;--gd:18s;--gdelay:-7s"></span>' +
          '<span class="fx-gold-fleck" style="--gx:86%;--gs:7px;--gd:14s;--gdelay:-11s"></span>';
      } else if (id === "star-night") {
        bg.innerHTML =
          '<div class="fx-aurora-veil"></div>' +
          '<svg class="fx-bg-svg fx-astrolabe" viewBox="0 0 360 360" fill="none">' +
            '<circle cx="180" cy="180" r="168" stroke="#e8d1a0" stroke-width="1.1" stroke-dasharray="2 7"/>' +
            '<circle cx="180" cy="180" r="132" stroke="#7cc4fa" stroke-width="1.1" stroke-opacity="0.78"/>' +
            '<circle cx="180" cy="180" r="94" stroke="#e8d1a0" stroke-width="0.9" stroke-dasharray="1.5 5"/>' +
            '<ellipse cx="180" cy="180" rx="158" ry="62" transform="rotate(-26 180 180)" stroke="#e8d1a0" stroke-width="0.9" stroke-opacity="0.62"/>' +
            '<ellipse cx="180" cy="180" rx="132" ry="44" transform="rotate(34 180 180)" stroke="#7cc4fa" stroke-width="0.8" stroke-opacity="0.48" stroke-dasharray="4 4"/>' +
            '<path d="M180 156 L186 174 L204 180 L186 186 L180 204 L174 186 L156 180 L174 174 Z" fill="rgba(232,209,160,0.42)" stroke="#e8d1a0" stroke-width="0.8"/>' +
          '</svg>' +
          '<svg class="fx-bg-svg fx-constellation" viewBox="0 0 560 270" fill="none">' +
            '<polyline points="36,216 114,162 204,176 284,114 378,130 468,68" stroke="rgba(232,209,160,0.34)" stroke-width="1.1" stroke-dasharray="3 4"/>' +
            '<circle cx="204" cy="176" r="9" fill="rgba(232,209,160,0.20)"/><circle cx="204" cy="176" r="3.4" fill="#e8d1a0" fill-opacity="0.90"/>' +
            '<circle cx="468" cy="68" r="10" fill="rgba(232,209,160,0.22)"/><circle cx="468" cy="68" r="3.6" fill="#e8d1a0" fill-opacity="0.94"/>' +
          '</svg>';
        fg.innerHTML =
          '<span class="fx-meteor" style="--my:14%;--mx:-8%;--md:7.5s;--mdelay:0.6s"></span>' +
          '<span class="fx-star" style="--sx:14%;--sy:18%;--ss:12px;--sc:#e8d1a0;--sd:3.2s;--sdelay:-1s">✦</span>' +
          '<span class="fx-star" style="--sx:84%;--sy:22%;--ss:10px;--sc:#7cc4fa;--sd:4.0s;--sdelay:-2.4s">✦</span>' +
          '<span class="fx-star" style="--sx:76%;--sy:78%;--ss:11px;--sc:#e8d1a0;--sd:3.5s;--sdelay:-0.5s">✦</span>';
      } else {
        bg.innerHTML = "";
        fg.innerHTML = "";
      }
    }

    function renderThemes() {
      var grid = document.getElementById("loginThemeGrid");
      var chip = function (t) {
        return '<button type="button" class="theme-chip ' + (t.id === curTheme ? "active" : "") + '" onclick="setTheme(\'' + t.id + '\', event)">'
          + '<span class="swatch ' + t.swatch + '"></span>'
          + '<span class="truncate">' + t.name + '</span>'
          + '</button>';
      };
      var days = THEMES.filter(function (t) { return t.mode === "day"; }).map(chip).join("");
      var nights = THEMES.filter(function (t) { return t.mode === "night"; }).map(chip).join("");
      var dayIcon = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>';
      var nightIcon = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      grid.innerHTML =
        '<div class="theme-col"><div class="theme-col-head">' + dayIcon + '<span>白天</span></div>' + days + '</div>' +
        '<div class="theme-col"><div class="theme-col-head">' + nightIcon + '<span>黑夜</span></div>' + nights + '</div>';
      renderThemeFx(curTheme);
    }

    var VT_STYLE_MAP = { "sky-day": "ripple", "star-night": "ripple", "paper-day": "scroll", "lacquer-night": "scroll", "pop-day": "slash", "vinyl-night": "iris" };
    var activeThemeVT = null;
    function setTheme(id, ev) {
      if (id === curTheme && document.documentElement.getAttribute("data-theme") === id) return;
      var x = ev && typeof ev.clientX === "number" && (ev.clientX || ev.clientY) ? ev.clientX : window.innerWidth / 2;
      var y = ev && typeof ev.clientY === "number" && (ev.clientX || ev.clientY) ? ev.clientY : window.innerHeight / 2;
      var apply = function () {
        curTheme = id;
        document.documentElement.setAttribute("data-theme", id);
        try { localStorage.setItem("ap2a_theme", id); } catch (e) {}
        renderThemes();
      };
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (document.startViewTransition && !reduceMotion) {
        var endR = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
        var root = document.documentElement;
        if (activeThemeVT) { try { activeThemeVT.skipTransition(); } catch (e) {} activeThemeVT = null; }
        root.style.setProperty("--vt-x", x + "px");
        root.style.setProperty("--vt-y", y + "px");
        root.style.setProperty("--vt-r", endR + "px");
        root.setAttribute("data-vt-style", VT_STYLE_MAP[id] || "ripple");
        root.classList.add("theme-vt-active");
        try {
          var vt = document.startViewTransition(apply);
          activeThemeVT = vt;
          vt.finished.finally(function () {
            if (activeThemeVT === vt) activeThemeVT = null;
            root.classList.remove("theme-vt-active");
            root.removeAttribute("data-vt-style");
          }).catch(function () {});
          return;
        } catch (e) {
          root.classList.remove("theme-vt-active");
          root.removeAttribute("data-vt-style");
        }
      }
      apply();
    }

    function togglePwd() {
      var inp = document.getElementById("loginPwd");
      inp.type = inp.type === "password" ? "text" : "password";
    }

    async function handleLogin(ev) {
      ev.preventDefault();
      var pwd = document.getElementById("loginPwd").value;
      var btn = document.getElementById("loginBtn");
      var err = document.getElementById("loginErr");
      err.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "验证中…";
      try {
        var r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pwd })
        });
        var d = {};
        try { d = await r.json(); } catch (e) {}
        if (r.ok && d.ok) {
          location.href = "/";
          return false;
        }
        err.textContent = d.error || ("登录失败（HTTP " + r.status + "）");
        err.classList.add("show");
      } catch (e) {
        err.textContent = "网络请求失败，请检查服务是否正常运行。";
        err.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.textContent = "进入控制台";
      }
      return false;
    }

    renderThemes();
    if (window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      var loginCard = document.querySelector(".glass-card.login-card");
      if (loginCard) {
        loginCard.addEventListener("pointermove", function (e) {
          if (curTheme !== "vinyl-night" && curTheme !== "lacquer-night" && curTheme !== "star-night") return;
          var r = loginCard.getBoundingClientRect();
          loginCard.style.setProperty("--mx", (e.clientX - r.left).toFixed(1) + "px");
          loginCard.style.setProperty("--my", (e.clientY - r.top).toFixed(1) + "px");
        }, { passive: true });
      }
    }
  </script>
</body>
</html>
